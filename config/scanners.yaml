# Framework conventions the discovery scanners rely on. Paths are relative to the framework repository roots
# set in .env (TDA_SELENIUM_REPO, TDA_PLAYWRIGHT_REPO).
# Playwright framework: znode-biww-playwright-automation-fork (branch dev).

selenium:
  sourceRoots: [src/main/java, src/test/java]
  constantsClass: TestDataConstants   # the framework's class of data constants
  registryClass: TestData             # and its registry of test data
  registryMethod: init
  workbooks: {}                       # name: file.xlsx of the Excel workbooks tests read
  pilots: []                          # test files to scan

playwright:
  pilots: []

# Files whose tests run on keys (globs relative to each framework repository). The keys check (`tda check-hardcoded`)
# fails if a test in them reads a value its approved requirement does not allow.
migrated:
  playwright: []
  selenium: []

# Files whose tests keep their JSON test data and get resolved values swapped in at run time (requirement strategy
# swap; the framework loader and fixture are wired once). The keys check covers them too: a data value must have an
# output and must not appear in the spec's code.
swapped:
  playwright: []

# Folders where new tests must be on keys from the start (new tests from a story, /new-test). Every file under paths is
# covered by the keys check, except the tests that existed before, listed once under legacy (print the list with
# `tda legacy-list <framework> <framework repository dir>`). A legacy file leaves the list when it is migrated.
keysRequired:
  playwright:
    paths: ["tests/**"]
    # keysRequired.playwright.legacy: 9 file(s) not on keys yet (fork at dev, 2026-11-26)
    legacy:
      - tests/seed.spec.ts
      - tests/webstore/ForgotPasswordPage/ForgotPasswordPageTest.spec.ts
      - tests/webstore/HomePage/FooterTest.spec.ts
      - tests/webstore/HomePage/HeaderTest.spec.ts
      - tests/webstore/LoginPage/LoginPageTest.spec.ts
      - tests/webstore/ProductDisplayPage/EmailAFriendTest.spec.ts
      - tests/webstore/ProductDisplayPage/ProductSettingTest.spec.ts
      - tests/webstore/ProductListingPage/CategoryPageTest.spec.ts
      - tests/webstore/RegistrationPage/RegistrationPageTest.spec.ts
