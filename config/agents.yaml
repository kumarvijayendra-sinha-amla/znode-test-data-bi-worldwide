# Project facts the generic agents of the tda-agents plugin read (they hold no Znode knowledge of their own).
# Changes go through review like any other config.

# Where a human exports the OpenAPI JSON that goes into specs/.
apiDocs: apidocs.znode.com

# collection-builder: which spec and operations to use.
apiChoices: |
  Prefer the Core API v2 (specs/znode-core-api-v2.json). Use the legacy v1 (specs/znode-core-api-v1.json) only where
  v2 cannot create and delete the record. Decided 2026-10-22: promotions (POST /Promotion/Create, POST /Promotion/Delete)
  and customer users (POST /User/CreateCustomerAccount, POST /User/DeleteUserAccount) use v1. v1 deletes take the IDs in
  the body (ParameterModel.Ids): teardown.bodyTemplate { "Ids": "{id}" }.

# /new-test: conventions of the BI Worldwide Playwright framework that story-analyst and test-author follow.
newTests:
  inputs: "Atlassian connector (Jira stories, linked issues and AIO test cases on amla.atlassian.net; Confluence FRD pages); else files in work/stories/<KEY>/input/"
  environment: "qa (TDA_ENV_NAME=qa; the fork runs with ENV=qa, playwright.config.ts copies ENV to TEST_ENV: config/qa.json webstoreURL for webstore stories, adminURL for Admin Portal stories)"
  userKey: "USER_WEBSTORE_REGISTERED for webstore stories; USER_ADMIN_PORTAL (param role: Admin or Super Admin) for Admin Portal stories"
  repository: "D:/znode-biww-playwright-automation-fork, branch qa/<STORY-KEY>-<slug> from origin/master (e.g. qa/BMP-84-storefront-header)"
  specRoot: "tests/webstore/<Area>Page/ or tests/admin/<Area>Page/ (one <Feature>Test.spec.ts per story area, like tests/webstore/LoginPage/LoginPageTest.spec.ts)"
  helper: "testData.value(ALIAS, OUTPUT) and testData.get(ALIAS) from the testData fixture; testData.useExisting(ALIAS, userName) only for a declared existing account"
  fixtures: "fixtures/base.fixture.ts (test with pom, config and testData; import { test } from '../../../fixtures/base.fixture')"
  pageObjects: "page_objects/{webstore,admin}/<Area>/ (locators) and page_actions/{webstore,admin}/<Area>/ (actions and checks), reached through the pom fixture (page_action_manager/PageActionManager.ts)"
  formatting: "money as the storefront shows it, e.g. $1,234.56 (en-US, 2 decimals); counts as plain integers"
  locators: "data-test-selector attribute (page.locator('[data-test-selector=\"...\"]'))"
  linking: "test case key in the test title, e.g. 'BMP-123: Verify ...', plus tag @regression"
  scan: "npm run scan:playwright -- <spec paths> (from this data repository; needs TDA_PLAYWRIGHT_REPO)"
  compile: "npx -y -p typescript@6 tsc --noEmit (in the framework repository; its tsconfig needs TypeScript 6, the adapter bundles 5.6)"
  logging: "test.step('<what> <value>') around each action and check in page_actions, as the existing page actions do; secret outputs (passwords) shown as ***"
  run: "ENV=qa npx playwright test <spec> --project=chromium --reporter=list (in the framework repository; --reporter replaces the config reporters, so no execution e-mail is sent)"

# tda run <suite>: normal and fallback mode. --reporter replaces the configured reporters (no execution e-mail);
# the junit file name matches run-compare's TEST-*.xml.
runs:
  workdir: "D:/znode-biww-playwright-automation-fork"
  command: "npx playwright test {suite} --project=chromium --reporter=list,junit"
  reports: "tda-reports"
  env:
    ENV: "qa"
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: "tda-reports/TEST-playwright.xml"
